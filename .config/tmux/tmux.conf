#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GENERAL SETTINGS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Set prefix to Alt + Space
unbind C-b
unbind-key -n M-[
unbind-key -n M-]
unbind-key -n C-[
unbind-key -n C-]
set-option -g prefix M-space
bind-key M-space send-prefix

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Enable focus events for better vim/neovim integration
set -g focus-events on

# Reduce escape time for better vim responsiveness
set -sg escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable aggressive resize (useful for multiple monitors)
setw -g aggressive-resize on

# Don't rename windows automatically
set -g allow-rename on

# Display messages for longer
set -g display-time 2000

# Increase repeat time for repeatable commands
set -g repeat-time 1000

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VI MODE & COPY MODE SETTINGS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Use vi keys in copy mode
setw -g mode-keys vi

# Vi-style copy/paste
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Copy to system clipboard (works on both X11 and Wayland)
# First try xclip for X11, then wl-copy for Wayland
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "if command -v wl-copy &> /dev/null; then wl-copy; elif command -v xclip &> /dev/null; then xclip -selection clipboard; else cat; fi"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "if command -v wl-copy &> /dev/null; then wl-copy; elif command -v xclip &> /dev/null; then xclip -selection clipboard; else cat; fi"

# Paste from tmux buffer
bind P paste-buffer

# To swich between windows
bind n next-window
bind p previous-window

# Enter copy mode with Alt + [ (no prefix needed)
bind y copy-mode \; display "📋 Copy mode enabled"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# KEYBINDINGS - WINDOW & PANE MANAGEMENT
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Reload config file with notification
bind r source-file ~/.config/tmux/tmux.conf \; display "✓ Config reloaded!" \; run-shell 'sleep 1'

# Split panes with more intuitive keybindings
bind ! split-window -h -c "#{pane_current_path}" \; display "→ Horizontal split"
bind - split-window -v -c "#{pane_current_path}" \; display "↓ Vertical split"
unbind '"'
unbind %

# Create new window in current path
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Switch between panes using Control + vim keys (no prefix needed)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes with vim-style keys and Control
bind -r M-H resize-pane -L 5
bind -r M-J resize-pane -D 5
bind -r M-K resize-pane -U 5
bind -r M-L resize-pane -R 5

# Switch windows with Shift + arrow keys (no prefix)
bind -n S-Left previous-window \; display "← Previous window"
bind -n S-Right next-window \; display "→ Next window"

# Reorder windows with Control + < >
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Break pane into new window
bind b break-pane -d \; display "📌 Pane moved to new window"

# Kill pane without confirmation
bind x kill-pane \; display "✕ Pane closed"

# Kill window without confirmation
bind X kill-window

# Synchronize panes (send commands to all panes in window)
bind S set-window-option synchronize-panes\; display "🔗 Sync: #{?pane_synchronized,ON ✓,OFF ✗}"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NOTIFICATION SYSTEM
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Monitor activity and display notifications
set -g monitor-activity on
set -g monitor-bell on
set -g visual-activity on
set -g visual-bell off
set -g bell-action any

# Activity in non-focused windows
set -g activity-action other

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STATUS BAR CUSTOMIZATION
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Status bar position
set -g status-position top

# Status bar colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Status bar update interval
set -g status-interval 5

# Status bar alignment
set -g status-justify left

# Left status bar
set -g status-left-length 50
set -g status-left "#[fg=#89b4fa,bg=#313244,bold] #{session_name} #[fg=#313244,bg=#1e1e2e]"

# Right status bar - showing date, time, and hostname
set -g status-right-length 100
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] %Y-%m-%d #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] %H:%M "

# Window status format (inactive windows)
setw -g window-status-format "#[fg=#cdd6f4,bg=#1e1e2e] #I:#W#F "

# Window status format (active window)
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W#F "

# Window status separator
setw -g window-status-separator ""

# Highlight active window on activity
setw -g window-status-activity-style "fg=#fab387,bg=#1e1e2e,bold"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PANE BORDERS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Pane border colors
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MESSAGE STYLING
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Command/message line colors
set -g message-style "fg=#1e1e2e,bg=#89b4fa,bold"
set -g message-command-style "fg=#1e1e2e,bg=#fab387,bold"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# COPY MODE STYLING
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Copy mode colors
setw -g mode-style "fg=#1e1e2e,bg=#89b4fa,bold"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ADDITIONAL ENHANCEMENTS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Bell/notification settings
set -g visual-silence off

# Clock mode
setw -g clock-mode-style 12
setw -g clock-mode-colour "#89b4fa"

# Enable automatic restore of clear screen (Ctrl-l)
bind C-l send-keys 'C-l'

# Quick session switching with notification
bind C-j split-window -v "tmux list-sessions | sed -E 's/:.*$//' | rg -v \"^$(tmux display-message -p '#S')\$\" | sk --reverse | xargs tmux switch-client -t" \; display "🔄 Switched session"

# Quick window switching using fzf (if available) with notification
bind w split-window -v "tmux list-windows -F '#{window_index}:#{window_name}' | sk --reverse | cut -d':' -f1 | xargs tmux select-window -t" \; display "🪟 Switched window"
