#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TERMINAL CAPABILITIES
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MATUGEN COLORS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -gq @thm_fg              "#eee0d5"
set -gq @thm_primary         "#fcb974"
set -gq @thm_inverse_primary "#855318"
set -gq @thm_surface_low     "#211a14"
set -gq @thm_surface         "#261e18"
set -gq @thm_surface_variant "#302921"
set -gq @thm_outline         "#50453a"
set -gq @thm_text_variant    "#d5c3b5"

source-file ~/.config/tmux/generated.conf
set -gq @thm_bg "#000000"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GENERAL SETTINGS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

unbind C-b
set -g prefix M-Space
bind-key M-Space send-prefix

set -g set-clipboard on
set -g focus-events on
set -sg escape-time 0
set -g history-limit 50000
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

set -g allow-rename on
set -g display-time 2000
set -g repeat-time 1000

set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# COPY MODE
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

setw -g mode-keys vi

bind y copy-mode \; display "📋 Copy mode enabled"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi C-c send -X cancel

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
"if command -v wl-copy &> /dev/null; then wl-copy; \
elif command -v xclip &> /dev/null; then xclip -selection clipboard; \
else cat; fi"

bind P paste-buffer

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PANES / WINDOWS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind -r M-H resize-pane -L 5
bind -r M-J resize-pane -D 5
bind -r M-K resize-pane -U 5
bind -r M-L resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window \; display "← Previous window"
bind -n S-Right next-window \; display "→ Next window"
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind b break-pane -d \; display "📌 Pane moved to new window"
bind x kill-pane \; display "✕ Pane closed"
bind X kill-window
bind S set-window-option synchronize-panes\; display "🔗 Sync: #{?pane_synchronized,ON ✓,OFF ✗}"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STATUS BAR (FIXED HYBRID)
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g status on
set -g status-position top
set -g status-interval 5

set -g status-left-length 100
set -g status-right-length 120

# LEFT
set -g status-left \
"#[fg=#{@thm_primary},bg=#{@thm_surface},bold] #{session_name} #[bg=#{@thm_bg}]"

# WINDOWS (NO INVALID COLORS)
setw -g window-status-format \
"#[fg=#{@thm_text_variant},bg=#{@thm_bg}] #I.#W "

setw -g window-status-current-format \
"#[fg=#{@thm_bg},bg=#{@thm_primary}, bold] #I.\
#[fg=#{@thm_bg}]#(basename #{pane_current_path}) "

setw -g window-status-separator ""

# RIGHT (ONLY YOUR COLORS)
set -g status-right \
"#[fg=#{@thm_text_variant},bg=#{@thm_surface}] %Y-%m-%d \
#[fg=#{@thm_bg},bg=#{@thm_primary},bold] %H:%M "

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PANES
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g pane-border-style "fg=#{@thm_outline}"
set -g pane-active-border-style "fg=#{@thm_primary}"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MESSAGES
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g message-style \
"fg=#{@thm_bg},bg=#{@thm_primary},bold"

set -g message-command-style \
"fg=#{@thm_bg},bg=#{@thm_surface_variant},bold"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# COPY MODE VISUAL
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

setw -g mode-style \
"fg=#{@thm_bg},bg=#{@thm_primary},bold"

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# EXTRA
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

setw -g clock-mode-style 12
set -g visual-silence off
