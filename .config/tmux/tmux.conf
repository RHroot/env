#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MATUGEN COLOR DEFAULTS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Base status background
set -g status-bg "#130d07"
set -gq @thm_bar_bg "#130d07"

# Theme palette
set -gq @thm_fg              "#eee0d5"
set -gq @thm_primary         "#fcb974"
set -gq @thm_inverse_primary "#855318"
set -gq @thm_surface_low     "#211a14"
set -gq @thm_surface         "#261e18"
set -gq @thm_surface_variant "#302921"
set -gq @thm_outline         "#50453a"
set -gq @thm_text_variant    "#d5c3b5"

# Core tmux styles using theme
set -g status-style        "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Load generated colors from matugen
source-file ~/.config/tmux/generated.conf
set -gq @thm_bg              "#000000"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GENERAL SETTINGS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
set-option -g default-shell /run/current-system/sw/bin/zsh

# Prefix key
unbind C-b
unbind-key -n M-[
unbind-key -n M-]
unbind-key -n C-[
unbind-key -n C-]

set-option -g prefix M-Space
bind-key M-Space send-prefix

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Improve vim/neovim interaction
set -g focus-events on
set -sg escape-time 0

# Scrollback
set -g history-limit 50000

# Mouse support
set -g mouse on

# Window indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane resizing
setw -g aggressive-resize on

# Window rename behavior
set -g allow-rename on

# Message timing
set -g display-time 2000
set -g repeat-time 1000


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VI MODE & COPY MODE
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

setw -g mode-keys vi

# Selection
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Clipboard copy (Wayland + X11)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
"if command -v wl-copy &> /dev/null; then wl-copy; \
elif command -v xclip &> /dev/null; then xclip -selection clipboard; \
else cat; fi"

bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
"if command -v wl-copy &> /dev/null; then wl-copy; \
elif command -v xclip &> /dev/null; then xclip -selection clipboard; \
else cat; fi"

# Paste
bind P paste-buffer

# Window navigation
bind n next-window
bind p previous-window

# Enter copy mode
bind y copy-mode \; display "Copy mode enabled"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WINDOW & PANE MANAGEMENT
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splitting
unbind '"'
unbind %

bind ! split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane resizing
bind -r M-H resize-pane -L 5
bind -r M-J resize-pane -D 5
bind -r M-K resize-pane -U 5
bind -r M-L resize-pane -R 5

# Window switching
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reorder windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Break pane
bind b break-pane -d

# Kill controls
bind x kill-pane
bind X kill-window

# Sync panes
bind S set-window-option \;\
display "Sync: #{?pane_synchronized,ON,OFF}"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NOTIFICATIONS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g monitor-activity on
set -g monitor-bell on

set -g visual-activity on
set -g visual-bell off

set -g bell-action any
set -g activity-action other


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STATUS BAR
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-left-length 50
set -g status-left \
"#[fg=#{@thm_primary},bg=#{@thm_surface},bold] #{session_name} #[bg=#{@thm_bg}]"

set -g status-right-length 100
set -g status-right \
"#[fg=#{@thm_text_variant},bg=#{@thm_surface}] %Y-%m-%d \
#[fg=#{@thm_bg},bg=#{@thm_primary},bold] %H:%M "

# Window tabs
setw -g window-status-format \
"#[fg=#{@thm_fg},bg=#{@thm_bg}] #I:#W#F "

setw -g window-status-current-format \
"#[fg=#{@thm_bg},bg=#{@thm_primary},bold] #I:#W#F "

setw -g window-status-separator ""

setw -g window-status-activity-style \
"fg=#{@thm_primary},bg=#{@thm_bg},bold"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PANES
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g pane-border-style "fg=#{@thm_outline}"
set -g pane-active-border-style "fg=#{@thm_primary}"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MESSAGE STYLING
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g message-style \
"fg=#{@thm_bg},bg=#{@thm_primary},bold"

set -g message-command-style \
"fg=#{@thm_bg},bg=#{@thm_surface_variant},bold"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# COPY MODE
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

setw -g mode-style \
"fg=#{@thm_bg},bg=#{@thm_primary},bold"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ADDITIONAL ENHANCEMENTS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

set -g visual-silence off

# Clock mode
setw -g clock-mode-style 12

# Clear screen passthrough
bind C-l send-keys C-l

# Session switcher
bind C-j split-window -v \
"tmux list-sessions | sed -E 's/:.*$//' | rg -v \"^$(tmux display-message -p '#S')\$\" | sk --reverse | xargs tmux switch-client -t"

# Window switcher
bind w split-window -v \
"tmux list-windows -F '#{window_index}:#{window_name}' | sk --reverse | cut -d':' -f1 | xargs tmux select-window -t"
