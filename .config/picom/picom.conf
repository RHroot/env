backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
unredir-if-possible = true;
shadow = false;
fading = false;
detect-client-opacity = true;
active-opacity = 0.9;
inactive-opacity = 0.7;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'Firefox'",
  "class_g = 'vlc'"
];

opacity-rule = [
  "85:class_g = 'Polybar'",
];

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 0.9; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.9; };
  dropdown_menu = { opacity = 0.9; };
};
