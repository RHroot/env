 #################################
#     Performance & Tearing     #
#################################

# GLX backend with vsync - eliminates screen tearing
backend = "glx";
vsync = true;

# Optimizations for better performance
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

# Unredirect fullscreen windows for better gaming performance
unredir-if-possible = true;

#################################
#        Shadow Settings        #
#################################

# Disabled for minimal resource usage
shadow = false;

#################################
#        Fade Settings          #
#################################

# Disabled for minimal resource usage
fading = false;

#################################
#     Transparency / Opacity    #
#################################

# Allow terminals to set their own transparency
detect-client-opacity = true;

# Default opacity values
active-opacity = 0.9;
inactive-opacity = 0.6;
frame-opacity = 1.0;

# Don't override application-set opacity
inactive-opacity-override = false;

#################################
#        Window Rules           #
#################################

# Exclude certain windows from compositing (avoid visual glitches)
focus-exclude = [
  "class_g = 'Polybar'"
];

# Opacity rules - adjust for your terminal
opacity-rule = [
  "90:class_g = 'kitty'",
  "90:class_g = 'Alacritty'"
];

#################################
#      Window Type Settings     #
#################################

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 0.9; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.9; };
  dropdown_menu = { opacity = 0.9; };
};
