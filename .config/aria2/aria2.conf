# ---------- GENERAL ----------
continue=true
file-allocation=falloc
auto-file-renaming=false
always-resume=true
disk-cache=128M
summary-interval=30
check-integrity=true
remote-time=true

# ---------- SPEED CAP (~19 Mbps) ----------
max-overall-download-limit=2458K
max-overall-upload-limit=256K

# ---------- CONNECTION ----------
max-connection-per-server=8
split=8
min-split-size=5M
reuse-uri=true
enable-http-pipelining=true
http-accept-gzip=true

# ---------- TORRENT ----------
enable-dht=true
enable-dht6=true
bt-enable-lpd=true
bt-max-peers=80
bt-request-peer-speed-limit=0
seed-ratio=0.0
seed-time=0

# ---------- NETWORK ----------
socket-recv-buffer-size=1M
timeout=30
max-tries=5
retry-wait=5
