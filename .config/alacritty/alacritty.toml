[terminal.shell]
program = "/run/current-system/sw/bin/zsh"

[colors.primary]
background = "#000000"

[cursor]
unfocused_hollow = false

[cursor.style]
shape = "Block"
blinking = "Never"

[cursor.vi_mode_style]
shape = "Block"
blinking = "Never"

[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dynamic_title = true
opacity = 0.90
blur = true

[window.padding]
x = 2
y = 0

[colors]
draw_bold_text_with_bright_colors = true
transparent_background_colors = true

[font]
size = 22

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font Mono"
style = "Bold Italic"

[keyboard]
bindings = [
{ key = "c", mods = "ALT", action = "CopySelection" },
{ key = "v", mods = "ALT", action = "PasteSelection" },
]

[mouse]
hide_when_typing = true

[general]
live_config_reload = true
import = ["~/.cache/Matugen/alacritty.toml"]
