###################################
# General & Window Settings
###################################
# Start in fullscreen by default
fs=yes

# Don't close the player window when video finishes
keep-open=yes

# Save playback position on quit
save-position-on-quit=yes

###################################
# Subtitle Positioning & Style
###################################
# Allow subs to render inside black bars (if video aspect ratio leaves black bars)
sub-use-margins=yes

# Snap subtitle vertical position (100 is absolute bottom, 95-98 sits right above the bottom edge)
sub-pos=98

# Set vertical margin gap from the bottom boundary (in pixels)
sub-margin-y=30

# Force ASS/SSA subtitles to respect margin/position overrides if needed
sub-ass-override=force

# Default language preference
slang=eng,en
alang=eng,en

###################################
# Video Output & Quality
###################################
vo=gpu-next
gpu-api=vulkan        # Change to 'opengl' if you get video playback glitches
hwdec=auto-safe

profile=high-quality
scale=ewa_lanczossharp
dscale=mitchell
cscale=spline36

# Reduce color banding and grain in dark scenes
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

# Correct color levels
target-prim=auto
target-trc=auto
video-output-levels=full
dither-depth=auto
