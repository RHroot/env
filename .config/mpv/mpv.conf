###################################
# General & Window Settings
###################################
# Launch in fullscreen by default
fs=yes

# Keep player open after video finishes
keep-open=yes

# Save playback position on quit
save-position-on-quit=yes

# Hide cursor automatically after 1 second in fullscreen
cursor-autohide=1000

###################################
# Subtitle Positioning & Style
###################################
# Position flush right above the bottom edge
sub-use-margins=yes
sub-pos=103
sub-margin-y=30

# Scales override on custom/ASS subtitles
sub-ass-override=scale

# Language defaults (prioritize English)
slang=eng,en
alang=eng,en

# Visuals: Bold yellow text, deep black border, depressed drop shadow
sub-font="Noto Sans"
sub-bold=yes
sub-font-size=40
sub-color="#FFE000"
sub-border-color="#000000"
sub-border-size=3.0

# Depressed heavy drop-shadow effect for ultra-high contrast
sub-shadow-offset=3.0
sub-shadow-color="#000000"

# Explicitly disable background box/fill so only text renders
sub-back-color="#00000000"

# Auto-load external subtitle files matching video name
sub-auto=fuzzy

###################################
# Video Output & Rendering
###################################
vo=gpu-next
gpu-api=opengl
hwdec=auto-safe

tone-mapping=bt.2446a
target-colorspace-hint=no

dscale=mitchell
cscale=spline36
profile=high-quality
scale=ewa_lanczossharp

# Reduce color banding and noise
deband=yes
deband-grain=5
deband-range=16
deband-iterations=2
deband-threshold=35

# Display color management
target-prim=auto
target-trc=auto
video-output-levels=full
dither-depth=auto

# Smooth motion (eliminates frame judder/stutter)
interpolation=yes
tscale=oversample
video-sync=display-resample

###################################
# Audio & Screenshots
###################################
# Auto-load external audio files
audio-file-auto=fuzzy

# Allow volume boost up to 200%
volume-max=200

# High-quality PNG screenshots saved to Pictures
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory="~/Screenshots"
