# ==================== HYPRLOCK CONFIG ====================
source = ~/.cache/Matugen/hypr-colors.conf

general {
    grace = 1
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $image
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    contrast = 0.9
}

# ==================== TIME & SECONDS ====================
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M:%S')</b>"
    color = $primary
    font_size = 90
    font_family = FiraCode Nerd Font Propo
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
}

# ==================== DAY & DATE ====================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    color = $secondary
    font_size = 22
    font_family = FiraCode Nerd Font Propo
    position = 0, 60
    halign = center
    valign = center
}

# ==================== USER AVATAR ====================
image {
    monitor =
    path = ~/.face.icon 
    size = 120
    border_color = $primary $tertiary 45deg
    border_size = 3
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
}

# ==================== PASSWORD INPUT ====================
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3
    rounding = 60
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary $tertiary $secondary 45deg
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = <i>󰌾  Enter Password...</i>
    check_color = $tertiary
    fail_color = $error
    position = 0, -230
    halign = center
    valign = center
}
