general {
    hide_cursor            = true
    ignore_empty_input     = true
}

background {
    blur_passes       = 2
    blur_size         = 5
    noise             = 0.005
    contrast          = 0.85
    brightness        = 0.75
}

label {
    text        = cmd[update:60000] echo "<b>$(date +"%H:%M")</b>"
    font_size   = 100
    font_family = Noto Sans
    position    = 0, 170
    halign      = center
    valign      = center
    shadow_passes = 1
}

label {
    text        = cmd[update:300000] echo "$(date +"%A, %d %B")"
    font_size   = 20
    font_family = Noto Sans
    position    = 0, 80
    halign      = center
    valign      = center
}

image {
    path         = /var/lib/AccountsService/icons/$USER
    size         = 80
    rounding     = -1
    border_size  = 2
    position     = 0, -60
    halign       = center
    valign       = center
    shadow_passes = 1
}

label {
    text        = $USER
    font_size   = 15
    font_family = Noto Sans Bold
    position    = 0, -145
    halign      = center
    valign      = center
}

input-field {
    size        = 300, 50
    outline_thickness  = 2
    dots_size          = 0.26
    font_family        = Noto Sans
    fade_on_empty      = true
    fade_timeout       = 1200
    placeholder_text   = <i>  password</i>
    fail_text          = <i>󰟅  $FAIL</i>
    rounding           = 10
    position           = 0, -210
    halign             = center
    valign             = center
    shadow_passes      = 1
}

label {
    text        = 󰌒  enter to unlock
    font_size   = 11
    font_family = Noto Sans
    position    = 0, -278
    halign      = center
    valign      = center
}

label {
    text        = cmd[update:5000] STATUS=$(playerctl status 2>/dev/null); ARTIST=$(playerctl metadata artist 2>/dev/null); TITLE=$(playerctl metadata title 2>/dev/null); if [ -n "$TITLE" ]; then if [ "$STATUS" = "Playing" ]; then ICON="󰎈"; else ICON="󰏤"; fi; echo "$ICON  $ARTIST — $TITLE" | cut -c1-50; fi
    font_size   = 13
    font_family = Noto Sans
    position    = 0, -340
    halign      = center
    valign      = center
}

label {
    text        = cmd[update:600000] curl -sf --max-time 2 "https://wttr.in/?format=%c+%t" 2>/dev/null | tr -d ' ' || echo "󰼯"
    font_size   = 13
    font_family = Noto Sans
    position    = -220, 44
    halign      = center
    valign      = bottom
}

label {
    text        = cmd[update:60000] BAT=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); if [ -n "$BAT" ]; then if [ "$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1)" = "Charging" ]; then ICON="󰂄"; elif [ "$BAT" -ge 90 ]; then ICON="󰁹"; elif [ "$BAT" -ge 70 ]; then ICON="󰂁"; elif [ "$BAT" -ge 50 ]; then ICON="󰁿"; elif [ "$BAT" -ge 30 ]; then ICON="󰁽"; elif [ "$BAT" -ge 15 ]; then ICON="󰁻"; else ICON="󰁺"; fi; echo "$ICON  $BAT%"; fi
    font_size   = 13
    font_family = Noto Sans
    position    = 0, 44
    halign      = center
    valign      = bottom
}

label {
    text        = cmd[update:60000] SSID=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2; exit}'); if [ -n "$SSID" ]; then QUAL=$(grep -oP '^\w+:\s+\K\d+' /proc/net/wireless 2>/dev/null | head -1); if [ "${QUAL:-0}" -ge 75 ]; then ICON="󰤨"; elif [ "${QUAL:-0}" -ge 50 ]; then ICON="󰤥"; elif [ "${QUAL:-0}" -ge 25 ]; then ICON="󰤢"; else ICON="󰤟"; fi; echo "$ICON  ${SSID:0:18}"; elif ip link show 2>/dev/null | grep -q "state UP"; then echo "󰈀  Wired"; else echo "󰤭"; fi
    font_size   = 13
    font_family = Noto Sans
    position    = 220, 44
    halign      = center
    valign      = bottom
}

label {
    text        = cmd[update:60000] echo "󰌢  $(hostname -s)"
    font_size   = 11
    font_family = Noto Sans
    position    = 20, 14
    halign      = left
    valign      = bottom
}

label {
    text        = cmd[update:60000] echo "󰥔  $(uptime | sed -E 's/.*up[[:space:]]+([0-9]+:[0-9]+).*/\1/')"
    font_size   = 11
    font_family = Noto Sans
    position    = -20, 14
    halign      = right
    valign      = bottom
}
