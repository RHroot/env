# ==================== HYPRLOCK CONFIG ====================
source = ~/.cache/hypr-colors.conf

# ==================== GENERAL ====================
general {
    no_fade_in = true
    grace = 1
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

# ==================== BACKGROUND ====================
background {
    monitor =
    path = $image
    blur_passes = 4
    blur_size = 8
    contrast = 0.95
    brightness = 0.8
    vibrancy = 0.2
}

# ==================== CLOCK ====================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = $on_background
    font_size = 60
    font_family = FiraCode Nerd Font Propo
    font_weight = 700
    halign = center
    valign = center
    position = 0, -250
    shadow_passes = 3
    shadow_size = 4
    shadow_color = $shadow
}

# ==================== DATE ====================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    color = $on_background
    font_size = 28
    font_family = FiraCode Nerd Font Propo
    font_weight = 500
    halign = center
    valign = center
    position = 0, -180
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
}

# ==================== GREETING ====================
label {
    monitor =
    text = "Hello, $USER"
    color = $on_background
    font_size = 24
    font_family = FiraCode Nerd Font Propo
    halign = center
    valign = center
    position = 0, -80
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
}

# ==================== PASSWORD INPUT ====================
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 60
    dots_size = 0.4
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    font_size = 20
    inner_color = $surface
    outer_color = $primary
    font_color = $on_background
    placeholder_text = "Enter password"
    halign = center
    valign = center
    position = 0, 0
    fail_text = Invalid password
    fail_color = $error
}

# ==================== FOOTER ====================
label {
    monitor =
    text = "Press ESC to cancel"
    color = $on_surface_variant
    font_size = 14
    font_family = FiraCode Nerd Font Propo
    halign = center
    valign = bottom
    position = 0, -60
    shadow_passes = 1
    shadow_size = 2
    shadow_color = $shadow
}
