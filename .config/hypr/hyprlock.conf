source = ~/.cache/Matugen/hypr-colors.conf

general {
    hide_cursor            = true
    ignore_empty_input     = true
}

background {
  monitor           =
    path              = $image
    blur_passes       = 4
    blur_size         = 7
    noise             = 0.0095
    contrast          = 0.85
    brightness        = 0.75
    vibrancy          = 0.15
    vibrancy_darkness = 0.0
}

label {
  monitor     =
    text        = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color       = $on_surface
    font_size   = 100
    font_family = JetBrainsMono Nerd Font

    position    = 0, 170
    halign      = center
    valign      = center

    shadow_passes = 2
    shadow_size   = 5
    shadow_color  = $shadow
    shadow_boost  = 1.2
}

label {
  monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color       = $on_surface_variant
    font_size   = 20
    font_family = JetBrainsMono Nerd Font

    position    = 0, 80
    halign      = center
    valign      = center

    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = $shadow
}

image {
  monitor      =
    path         = /var/lib/AccountsService/icons/$USER
    size         = 80
    rounding     = -1

    border_size  = 2
    border_color = $primary

    position     = 0, -60
    halign       = center
    valign       = center

    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}

label {
  monitor     =
    text        = $USER
    color       = $on_primary_container
    font_size   = 15
    font_family = JetBrainsMono Nerd Font Bold

    position    = 0, -145
    halign      = center
    valign      = center
}

input-field {
  monitor     =
    size        = 300, 50

    outline_thickness  = 2
    dots_size          = 0.26
    dots_spacing       = 0.18
    dots_center        = true
    dots_rounding      = -1

    outer_color        = $primary
    inner_color        = $surface_container
    font_color         = $on_surface
    font_family        = JetBrainsMono Nerd Font

    fade_on_empty      = true
    fade_timeout       = 1200
    placeholder_text   = <i>  password</i>

    check_color        = $primary
    fail_color         = $error
    fail_text          = <i>󰟅  $FAIL ($ATTEMPTS)</i>

    capslock_color     = $tertiary
    numlock_color      = -1
    bothlock_color     = -1

    rounding           = 10

    position           = 0, -210
    halign             = center
    valign             = center

    shadow_passes      = 2
    shadow_size        = 5
    shadow_color       = $shadow
    shadow_boost       = 1.1
}

label {
  monitor     =
    text        = 󰌒  enter to unlock
    color       = $outline
    font_size   = 11
    font_family = JetBrainsMono Nerd Font

    position    = 0, -278
    halign      = center
    valign      = center
}

label {
  monitor     =
    text        = cmd[update:2000] \
    STATUS=$(playerctl status 2>/dev/null); \
    ARTIST=$(playerctl metadata artist 2>/dev/null); \
    TITLE=$(playerctl metadata title 2>/dev/null); \
    if [ -n "$TITLE" ]; then \
      if [ "$STATUS" = "Playing" ]; then ICON="󰎈"; else ICON="󰏤"; fi; \
        FULL="$ARTIST — $TITLE"; \
          SHORT=$(echo "$FULL" | cut -c1-44); \
          echo "$ICON  $SHORT"; \
          fi
          color       = $on_surface_variant
          font_size   = 13
          font_family = JetBrainsMono Nerd Font

          position    = 0, -340
          halign      = center
          valign      = center

          shadow_passes = 1
          shadow_size   = 2
          shadow_color  = $shadow
}

label {
  monitor     =
    text        = cmd[update:300000] \
    WTTR=$(curl -sf --max-time 5 "https://wttr.in/?format=%c+%t" 2>/dev/null | tr -d ' '); \
    if [ -n "$WTTR" ]; then echo "$WTTR"; else echo "󰼯  N/A"; fi
      color       = $on_surface_variant
        font_size   = 13
        font_family = JetBrainsMono Nerd Font

        position    = -220, 44
        halign      = center
        valign      = bottom

        shadow_passes = 1
        shadow_size   = 2
        shadow_color  = $shadow
}

label {
  monitor     =
    text        = cmd[update:30000] \
    BAT=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); \
    STS=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); \
    if [ -n "$BAT" ]; then \
      if   [ "$STS" = "Charging" ];    then ICON="󰂄"; \
        elif [ "$BAT" -ge 90 ]; then ICON="󰁹"; \
          elif [ "$BAT" -ge 70 ]; then ICON="󰂁"; \
          elif [ "$BAT" -ge 50 ]; then ICON="󰁿"; \
          elif [ "$BAT" -ge 30 ]; then ICON="󰁽"; \
          elif [ "$BAT" -ge 15 ]; then ICON="󰁻"; \
      else                          ICON="󰁺"; fi; \
        echo "$ICON  $BAT%"; \
          fi
          color       = $on_surface_variant
          font_size   = 13
          font_family = JetBrainsMono Nerd Font

          position    = 0, 44
          halign      = center
          valign      = bottom

          shadow_passes = 1
          shadow_size   = 2
          shadow_color  = $shadow
}

label {
    monitor     =
    text        = cmd[update:10000] \
        IFACE=$(awk '/^ / {print $1}' /proc/net/wireless 2>/dev/null | tr -d ':' | head -1); \
        if [ -n "$IFACE" ]; then \
            SSID=""; \
            if command -v nmcli >/dev/null 2>&1; then SSID=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2; exit}'); \
            elif command -v iw >/dev/null 2>&1; then SSID=$(iw dev "$IFACE" link 2>/dev/null | awk '/SSID/ {print $2}'); \
            elif command -v iwgetid >/dev/null 2>&1; then SSID=$(iwgetid -r "$IFACE" 2>/dev/null); fi; \
            if [ -n "$SSID" ]; then \
                QUALITY=$(awk -v iface="$IFACE" '$1 == iface":" {print int($3 * 100 / 70)}' /proc/net/wireless 2>/dev/null); \
                if   [ "${QUALITY:-0}" -ge 75 ]; then ICON="󰤨"; \
                elif [ "${QUALITY:-0}" -ge 50 ]; then ICON="󰤥"; \
                elif [ "${QUALITY:-0}" -ge 25 ]; then ICON="󰤢"; \
                else                                  ICON="󰤟"; fi; \
                echo "$ICON  $(echo "$SSID" | cut -c1-18)"; \
            else echo "󰤭  WiFi"; fi; \
        elif ip link show 2>/dev/null | grep -q "state UP"; then \
            echo "󰈀  Wired"; \
        else echo "󰤭  Offline"; fi
    color       = $on_surface_variant
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 220, 44
    halign      = center
    valign      = bottom
    shadow_passes = 1
    shadow_size   = 2
    shadow_color  = $shadow
}

label {
  monitor     =
    text        = cmd[update:0] echo "󰌢  $(hostname)"
    color       = $surface_container_highest
    font_size   = 11
    font_family = JetBrainsMono Nerd Font

    position    = 20, 14
    halign      = left
    valign      = bottom
}

label {
  monitor     =
  text = cmd[update:60000] echo "󰥔  $(uptime | sed -E 's/.*up[[:space:]]+([0-9]+:[0-9]+).*/\1/')"
    color       = $surface_container_highest
    font_size   = 11
    font_family = JetBrainsMono Nerd Font

    position    = -20, 14
    halign      = right
    valign      = bottom
}
