# ╔══════════════════════════════════════════════════════════╗
# ║              hyprlock.conf — Matugen Material You        ║
# ║              Font: FiraCode Nerd Font                    ║
# ║              Style: Clean & Minimal                      ║
# ╚══════════════════════════════════════════════════════════╝
#
# Layout (all relative to screen center, valign=center):
#
#   +170   →  clock        (100px, ~110px tall)
#   + 80   →  date         (20px,  ~28px tall)
#   center area is ~38px clear gap before avatar
#   - 60   →  avatar       (80px circle)
#   -145   →  username     (15px)
#   -210   →  input field  (50px tall)
#   -278   →  hint         (11px)
#   -340   →  media player (13px, hidden when nothing playing)
#
#   valign=bottom:
#   + 44   →  weather | battery | network  (13px)
#   + 14   →  hostname (left)  uptime (right)
#
# ──────────────────────────────────────────────────────────

source = ~/.cache/Matugen/hypr-colors.conf

# ──────────────────────────────────────────────────────────
# GENERAL
# ──────────────────────────────────────────────────────────
general {
    hide_cursor            = true
    ignore_empty_input     = true
}

# ──────────────────────────────────────────────────────────
# BACKGROUND
# ──────────────────────────────────────────────────────────
background {
  monitor           =
    path              = $image
    blur_passes       = 4
    blur_size         = 7
    noise             = 0.0095
    contrast          = 0.85
    brightness        = 0.75
    vibrancy          = 0.15
    vibrancy_darkness = 0.0
}

# ──────────────────────────────────────────────────────────
# CLOCK  —  y: center + 170
# 100px font ≈ 110px rendered height
# Bottom edge sits at roughly center + 225
# ──────────────────────────────────────────────────────────
label {
  monitor     =
    text        = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color       = $on_surface
    font_size   = 100
    font_family = FiraCode Nerd Font

    position    = 0, 170
    halign      = center
    valign      = center

    shadow_passes = 2
    shadow_size   = 5
    shadow_color  = $shadow
    shadow_boost  = 1.2
}

# ──────────────────────────────────────────────────────────
# DATE  —  y: center + 80
# 20px font ≈ 28px rendered height
# Sits ~35px below bottom of clock
# ──────────────────────────────────────────────────────────
label {
  monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color       = $on_surface_variant
    font_size   = 20
    font_family = FiraCode Nerd Font

    position    = 0, 80
    halign      = center
    valign      = center

    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = $shadow
}

# ──────────────────────────────────────────────────────────
# AVATAR  —  y: center - 60
# 80px circle = radius 40, so top at -100, bottom at -20
# 38px gap below date (date bottom ≈ +66, avatar top ≈ -100)
# ──────────────────────────────────────────────────────────
image {
  monitor      =
    path         = /var/lib/AccountsService/icons/$USER
    size         = 80
    rounding     = -1

    border_size  = 2
    border_color = $primary

    position     = 0, -60
    halign       = center
    valign       = center

    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}

# ──────────────────────────────────────────────────────────
# USERNAME  —  y: center - 145
# Avatar bottom ≈ -20 → 15px gap → username baseline at -140
# ──────────────────────────────────────────────────────────
label {
  monitor     =
    text        = $USER
    color       = $on_primary_container
    font_size   = 15
    font_family = FiraCode Nerd Font Bold

    position    = 0, -145
    halign      = center
    valign      = center
}

# ──────────────────────────────────────────────────────────
# INPUT FIELD  —  y: center - 210
# 50px tall field; top at -235, bottom at -185
# 25px gap below username
# ──────────────────────────────────────────────────────────
input-field {
  monitor     =
    size        = 300, 50

    outline_thickness  = 2
    dots_size          = 0.26
    dots_spacing       = 0.18
    dots_center        = true
    dots_rounding      = -1

    outer_color        = $primary
    inner_color        = $surface_container
    font_color         = $on_surface
    font_family        = FiraCode Nerd Font

    fade_on_empty      = true
    fade_timeout       = 1200
    placeholder_text   = <i>  password</i>

    check_color        = $primary
    fail_color         = $error
    fail_text          = <i>󰟅  $FAIL ($ATTEMPTS)</i>

    capslock_color     = $tertiary
    numlock_color      = -1
    bothlock_color     = -1

    rounding           = 10

    position           = 0, -210
    halign             = center
    valign             = center

    shadow_passes      = 2
    shadow_size        = 5
    shadow_color       = $shadow
    shadow_boost       = 1.1
}

# ──────────────────────────────────────────────────────────
# UNLOCK HINT  —  y: center - 278
# 11px text ≈ 16px tall; 18px gap below input bottom (-185)
# ──────────────────────────────────────────────────────────
label {
  monitor     =
    text        = 󰌒  enter to unlock
    color       = $outline
    font_size   = 11
    font_family = FiraCode Nerd Font

    position    = 0, -278
    halign      = center
    valign      = center
}

# ──────────────────────────────────────────────────────────
# MEDIA PLAYER  —  y: center - 340
# 13px text ≈ 20px tall; clear gap of ~42px below hint
# Outputs nothing when playerctl finds no active player
# so zero height = no wasted space
# ──────────────────────────────────────────────────────────
label {
  monitor     =
    text        = cmd[update:2000] \
    STATUS=$(playerctl status 2>/dev/null); \
    ARTIST=$(playerctl metadata artist 2>/dev/null); \
    TITLE=$(playerctl metadata title 2>/dev/null); \
    if [ -n "$TITLE" ]; then \
      if [ "$STATUS" = "Playing" ]; then ICON="󰎈"; else ICON="󰏤"; fi; \
        FULL="$ARTIST — $TITLE"; \
          SHORT=$(echo "$FULL" | cut -c1-44); \
          echo "$ICON  $SHORT"; \
          fi
          color       = $on_surface_variant
          font_size   = 13
          font_family = FiraCode Nerd Font

          position    = 0, -340
          halign      = center
          valign      = center

          shadow_passes = 1
          shadow_size   = 2
          shadow_color  = $shadow
}

# ──────────────────────────────────────────────────────────
# STATUS ROW  —  valign: bottom, y: +44
# Three labels spaced 220px apart so they never touch:
#   weather:  x = -220
#   battery:  x =    0
#   network:  x = +220
# Each is ~13px font ≈ 20px rendered height
# ──────────────────────────────────────────────────────────

# WEATHER  (left of center)
label {
  monitor     =
    text        = cmd[update:300000] \
    WTTR=$(curl -sf --max-time 5 "https://wttr.in/?format=%c+%t" 2>/dev/null | tr -d ' '); \
    if [ -n "$WTTR" ]; then echo "$WTTR"; else echo "󰼯  N/A"; fi
      color       = $on_surface_variant
        font_size   = 13
        font_family = FiraCode Nerd Font

        position    = -220, 44
        halign      = center
        valign      = bottom

        shadow_passes = 1
        shadow_size   = 2
        shadow_color  = $shadow
}

# BATTERY  (center)
label {
  monitor     =
    text        = cmd[update:30000] \
    BAT=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); \
    STS=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); \
    if [ -n "$BAT" ]; then \
      if   [ "$STS" = "Charging" ];    then ICON="󰂄"; \
        elif [ "$BAT" -ge 90 ]; then ICON="󰁹"; \
          elif [ "$BAT" -ge 70 ]; then ICON="󰂁"; \
          elif [ "$BAT" -ge 50 ]; then ICON="󰁿"; \
          elif [ "$BAT" -ge 30 ]; then ICON="󰁽"; \
          elif [ "$BAT" -ge 15 ]; then ICON="󰁻"; \
      else                          ICON="󰁺"; fi; \
        echo "$ICON  $BAT%"; \
          fi
          color       = $on_surface_variant
          font_size   = 13
          font_family = FiraCode Nerd Font

          position    = 0, 44
          halign      = center
          valign      = bottom

          shadow_passes = 1
          shadow_size   = 2
          shadow_color  = $shadow
}

# NETWORK  (right of center)
label {
    monitor     =
    text        = cmd[update:10000] \
        IFACE=$(awk '/^ / {print $1}' /proc/net/wireless 2>/dev/null | tr -d ':' | head -1); \
        if [ -n "$IFACE" ]; then \
            SSID=""; \
            if command -v nmcli >/dev/null 2>&1; then SSID=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2; exit}'); \
            elif command -v iw >/dev/null 2>&1; then SSID=$(iw dev "$IFACE" link 2>/dev/null | awk '/SSID/ {print $2}'); \
            elif command -v iwgetid >/dev/null 2>&1; then SSID=$(iwgetid -r "$IFACE" 2>/dev/null); fi; \
            if [ -n "$SSID" ]; then \
                QUALITY=$(awk -v iface="$IFACE" '$1 == iface":" {print int($3 * 100 / 70)}' /proc/net/wireless 2>/dev/null); \
                if   [ "${QUALITY:-0}" -ge 75 ]; then ICON="󰤨"; \
                elif [ "${QUALITY:-0}" -ge 50 ]; then ICON="󰤥"; \
                elif [ "${QUALITY:-0}" -ge 25 ]; then ICON="󰤢"; \
                else                                  ICON="󰤟"; fi; \
                echo "$ICON  $(echo "$SSID" | cut -c1-18)"; \
            else echo "󰤭  WiFi"; fi; \
        elif ip link show 2>/dev/null | grep -q "state UP"; then \
            echo "󰈀  Wired"; \
        else echo "󰤭  Offline"; fi
    color       = $on_surface_variant
    font_size   = 13
    font_family = FiraCode Nerd Font
    position    = 220, 44
    halign      = center
    valign      = bottom
    shadow_passes = 1
    shadow_size   = 2
    shadow_color  = $shadow
}

# ──────────────────────────────────────────────────────────
# BOTTOM STRIP  —  valign: bottom, y: +14
# hostname flush left, uptime flush right
# These are faint so they don't compete with the status row
# ──────────────────────────────────────────────────────────

# HOSTNAME  (bottom-left)
label {
  monitor     =
    text        = cmd[update:0] echo "󰌢  $(hostname)"
    color       = $surface_container_highest
    font_size   = 11
    font_family = FiraCode Nerd Font

    position    = 20, 14
    halign      = left
    valign      = bottom
}

# UPTIME  (bottom-right)
label {
  monitor     =
  text = cmd[update:60000] echo "󰥔  $(uptime | sed -E 's/.*up[[:space:]]+([0-9]+:[0-9]+).*/\1/')"
    color       = $surface_container_highest
    font_size   = 11
    font_family = FiraCode Nerd Font

    position    = -20, 14
    halign      = right
    valign      = bottom
}
