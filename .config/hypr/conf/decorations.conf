# Import Matugen colors
source = ~/.cache/Matugen/hypr-colors.conf

general {
  border_size = 2
    gaps_in = 1
    gaps_out = 1

    col.active_border = $on_primary_container
    col.inactive_border = $surface_variant
}

decoration {
  rounding = 9

    active_opacity = 1.0
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0

    dim_inactive = false

    shadow {
      enabled = true
        range = 4
        render_power = 3
    }

  blur {
    enabled = true
      size = 6
      ignore_opacity = true
      passes = 3
      noise = 0.01

      vibrancy = 0.1696
  }
}

group {
  col.border_active = $tertiary_container
    groupbar {
      col.active = $tertiary
    }
}
