# Import Matugen colors
source = ~/.cache/hypr-colors.conf

general {
  border_size = 2
  gaps_in = 1
  gaps_out = 1

  col.active_border = $primary
  col.inactive_border = $surface_variant
}

decoration {
  rounding = 9

  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false

  shadow {
    enabled = false
  }

  blur {
    enabled = false
  }
}

group {
  col.border_active = $tertiary_container
  groupbar {
    col.active = $tertiary
  }
}
