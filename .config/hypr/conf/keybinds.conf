# ==========================================
#           VARIABLE DEFINITIONS
# ==========================================
# Application shortcuts
$terminal = kitty
$filemanager = nautilus
$alt_terminal = neovide
$gaming = nvidia-run steam
$digitalpainting = krita --no-splash --new
$rastereditor = gimp --no-splash --new-instance
$vanishing_terminal = kitten quick-access-terminal
$vectoreditor = inkscape --no-splash --new-instance
$menu = rofi -show combi -modes combi -combi-modes "window,drun,run"
$browser = firefox -P "default"
$alt_browser = firefox -P "Work"

$theme = $HOME/env/nixos/modules/WM/wset
$bar = $HOME/env/nixos/modules/WM/bar-refresh
$powermenu = $HOME/env/nixos/modules/WM/powermenu
$clipboardmanager = $HOME/env/nixos/modules/WM/clipman

# ==========================================
#           APPLICATION LAUNCHERS
# ==========================================
# Quick application access
bind = SUPER SHIFT, E, exec, emacsclient -c
bind = SUPER, Return, exec, $terminal
bind = SUPER, P, exec, $vanishing_terminal
bind = SUPER SHIFT, Return, exec, $alt_terminal
bind = SUPER, Space, exec, $menu
bind = SUPER SHIFT, Space, exec, $theme
bind = SUPER, B, exec, $browser
bind = SUPER SHIFT, B, exec, $alt_browser
bind = SUPER, E, exec, $filemanager
bind = SUPER SHIFT, P, exec, $bar
bind = SUPER, G, exec, $gaming
bind = SUPER SHIFT, G, exec, $rastereditor
bind = SUPER, I, exec, $vectoreditor
bind = SUPER, D, exec, $digitalpainting
bind = SUPER, S, exec, stickers
bind = SUPER, period, exec, icon_picker
bind = SUPER, N, exec, netrofi
bind = SUPER SHIFT, V, exec, pavucontrol
bind = SUPER , V, exec, $clipboardmanager

# ==========================================
#           SYSTEM CONTROLS
# ==========================================
# System power and session management
bind = SUPER, Escape, exec, $powermenu            # Power menu
bind = CTRL ALT, L, exec, hyprlock                # Lock screen
bind = CTRL ALT, S, exec, systemctl poweroff      # Shutdown
bind = CTRL ALT, R, exec, systemctl reboot        # Reboot
bind = CTRL ALT, Q, exec, hyprctl dispatch exit 0 # Exit Hyprland

# ==========================================
#           WINDOW MANAGEMENT
# ==========================================
# Window control and manipulation
bind = SUPER, Q, killactive # Close active window
bind = SUPER, F, fullscreen # Toggle fullscreen
bind = SUPER SHIFT, F, togglefloating, active

# Window grouping
bind = SUPER, M, exec, hyprctl keyword general:layout monocle
bind = SUPER, S, exec, hyprctl keyword general:layout scroll
bind = SUPER SHIFT, M, exec, hyprctl keyword general:layout master
bind = SUPER SHIFT, T, togglesplit,        # Toggle splits
bind = SUPER CTRL, G, togglegroup,         # Toggle window group
bind = SUPER CTRL, tab, changegroupactive, # Change group focus

# Window cycling
bind = ALT, tab, cyclenext,        # Cycle through windows
bind = ALT, tab, bringactivetotop, # Bring active to top

# ============================
# Hyprshot keybinds
# ============================
# FULL SCREEN → Save to $HOME/Screenshots
bind = SUPER, PRINT, exec, hyprshot -m output -o $HOME/Screenshots
# FULL SCREEN → Copy only (no file)
bind = , PRINT, exec, hyprshot -m output --clipboard-only
# REGION → Copy only
bind = CTRL, PRINT, exec, hyprshot -m region --clipboard-only
# REGION → Save only
bind = CTRL SHIFT, PRINT, exec, hyprshot -m region -o $HOME/Screenshots

# Utility scripts
bind = SUPER , R, exec, hyprctl reload # Reload Hyprland

# ==========================================
#           WORKSPACE NAVIGATION
# ==========================================
# Workspace switching
bind = SUPER, k, workspace, +1 # Next workspace
bind = SUPER, j, workspace, -1 # Previous workspace

# Focus movement
bind = ALT, h, movefocus, l # Move focus left
bind = ALT, l, movefocus, r # Move focus right
bind = ALT, k, movefocus, u # Move focus up
bind = ALT, j, movefocus, d # Move focus down

# ==========================================
#           WORKSPACE NUMBERS
# ==========================================
# Switch to workspace with mainMod + [0-9]
bind = SUPER, code:10, workspace, 1  # Workspace 1
bind = SUPER, code:11, workspace, 2  # Workspace 2
bind = SUPER, code:12, workspace, 3  # Workspace 3
bind = SUPER, code:13, workspace, 4  # Workspace 4
bind = SUPER, code:14, workspace, 5  # Workspace 5
bind = SUPER, code:15, workspace, 6  # Workspace 6
bind = SUPER, code:16, workspace, 7  # Workspace 7
bind = SUPER, code:17, workspace, 8  # Workspace 8
bind = SUPER, code:18, workspace, 9  # Workspace 9
bind = SUPER, code:19, workspace, 10 # Workspace 10

# Move window to workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, code:10, movetoworkspace, 1  # Move to workspace 1
bind = SUPER SHIFT, code:11, movetoworkspace, 2  # Move to workspace 2
bind = SUPER SHIFT, code:12, movetoworkspace, 3  # Move to workspace 3
bind = SUPER SHIFT, code:13, movetoworkspace, 4  # Move to workspace 4
bind = SUPER SHIFT, code:14, movetoworkspace, 5  # Move to workspace 5
bind = SUPER SHIFT, code:15, movetoworkspace, 6  # Move to workspace 6
bind = SUPER SHIFT, code:16, movetoworkspace, 7  # Move to workspace 7
bind = SUPER SHIFT, code:17, movetoworkspace, 8  # Move to workspace 8
bind = SUPER SHIFT, code:18, movetoworkspace, 9  # Move to workspace 9
bind = SUPER SHIFT, code:19, movetoworkspace, 10 # Move to workspace 10

# Move window to workspace with brackets
bind = SUPER SHIFT, bracketleft, movetoworkspace, -1  # Move to previous workspace
bind = SUPER SHIFT, bracketright, movetoworkspace, +1 # Move to next workspace

# Move window to workspace silently with mainMod + CTRL + [0-9]
bind = SUPER CTRL, code:10, movetoworkspacesilent, 1  # Move silently to workspace 1
bind = SUPER CTRL, code:11, movetoworkspacesilent, 2  # Move silently to workspace 2
bind = SUPER CTRL, code:12, movetoworkspacesilent, 3  # Move silently to workspace 3
bind = SUPER CTRL, code:13, movetoworkspacesilent, 4  # Move silently to workspace 4
bind = SUPER CTRL, code:14, movetoworkspacesilent, 5  # Move silently to workspace 5
bind = SUPER CTRL, code:15, movetoworkspacesilent, 6  # Move silently to workspace 6
bind = SUPER CTRL, code:16, movetoworkspacesilent, 7  # Move silently to workspace 7
bind = SUPER CTRL, code:17, movetoworkspacesilent, 8  # Move silently to workspace 8
bind = SUPER CTRL, code:18, movetoworkspacesilent, 9  # Move silently to workspace 9
bind = SUPER CTRL, code:19, movetoworkspacesilent, 10 # Move silently to workspace 10

# Move window to workspace silently with brackets
bind = SUPER CTRL, bracketleft, movetoworkspacesilent, -1  # Move silently to previous workspace
bind = SUPER CTRL, bracketright, movetoworkspacesilent, +1 # Move silently to next workspace

bind = ALT SHIFT, L, resizeactive, 50 0
bind = ALT SHIFT, H, resizeactive, -50 0
bind = ALT SHIFT, K, resizeactive, 0 -50
bind = ALT SHIFT, J, resizeactive, 0 50

# ==========================================
#           MOUSE BINDINGS
# ==========================================
# Mouse window management
bindm = SUPER, mouse:272, movewindow   # Move window with left mouse button
bindm = SUPER, mouse:273, resizewindow # Resize window with right mouse button

# ==========================================
#           AUDIO CONTROLS
# ==========================================
# Audio volume and playback controls (PipeWire/WirePlumber)
# Volume
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ # Volume up
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05- # Volume down
binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle         # Mute/unmute
binde = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle    # Mute/unmute mic

# Media
binde = , XF86AudioPlay, exec, playerctl play-pause
binde = , XF86AudioNext, exec, playerctl next
binde = , XF86AudioPrev, exec, playerctl previous
binde = , XF86AudioStop, exec, playerctl stop

# Screen brightness
bind = , XF86MonBrightnessUp, exec, sh -c 'brightnessctl set +10% >/dev/null; level=$(brightnessctl -m | cut -d, -f4 | tr -d %); notify-send "Brightness: $level%"'
bind = , XF86MonBrightnessDown, exec, sh -c 'brightnessctl set 10%- >/dev/null; level=$(brightnessctl -m | cut -d, -f4 | tr -d %); notify-send "Brightness: $level%"'

# Keyboard backlight
bind = , XF86KbdBrightnessUp, exec, sh -c 'brightnessctl -d "*::kbd_backlight" set +33% >/dev/null; cur=$(brightnessctl -d "*::kbd_backlight" get); max=$(brightnessctl -d "*::kbd_backlight" max); pct=$((100 * cur / max)); notify-send "Kbd: $pct%"'
bind = , XF86KbdBrightnessDown, exec, sh -c 'brightnessctl -d "*::kbd_backlight" set 33%- >/dev/null; cur=$(brightnessctl -d "*::kbd_backlight" get); max=$(brightnessctl -d "*::kbd_backlight" max); pct=$((100 * cur / max)); notify-send "Kbd: $pct%"'

bindl = , switch:Lid Switch, exec, hyprlock
