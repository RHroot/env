# Import Matugen colors
source = $HOME/.cache/Matugen/hyprland-colors.conf

general {
  border_size = 2
    gaps_in = 2
    gaps_out = 2

    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $surface_variant
}

decoration {
  rounding = 9

    active_opacity = 0.9
    inactive_opacity = 0.7
    fullscreen_opacity = 1.0

    dim_inactive = false

    shadow {
      enabled = true
        range = 5
        render_power = 4
        color = $primary
        color_inactive = rgba(00000000)
    }

  blur {
    enabled = true
      size = 1
      ignore_opacity = true
      passes = 2
  }
}

group {
  col.border_active = $tertiary_container
    groupbar {
      col.active = $tertiary
    }
}
