 [style.description]
foreground = "white"
underline = false
bold = false
italic = false

[style.command_name]
foreground = "cyan"
underline = false
bold = true
italic = false

[style.example_text]
foreground = "white"
underline = false
bold = false
italic = false

[style.example_code]
foreground = "green"
underline = false
bold = false
italic = false

[style.example_variable]
foreground = "cyan"
underline = true
bold = false
italic = false

[display]
compact = false
use_pager = true
show_title = true

[updates]
auto_update = true
auto_update_interval_hours = 168
archive_source = "https://github.com/tldr-pages/tldr/releases/latest/download/"
tls_backend = "rustls-with-webpki-roots"
