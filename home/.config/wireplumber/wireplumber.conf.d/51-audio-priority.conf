monitor.alsa.rules = [
  # Allow NVIDIA card to switch to HDMI when monitor is connected
  {
    matches = [ { device.name = "~alsa_card.pci-0000_01_00.*" } ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }

  # NVIDIA HDMI: highest priority
  {
    matches = [ { node.name = "~alsa_output.pci-0000_01_00.*hdmi.*" } ]
    actions = {
      update-props = {
        priority.driver = 3000
        priority.session = 3000
      }
    }
  }

  # NVIDIA Pro Audio, if it appears: low priority
  {
    matches = [ { node.name = "~alsa_output.pci-0000_01_00.*pro-audio.*" } ]
    actions = {
      update-props = {
        priority.driver = 10
        priority.session = 10
      }
    }
  }

  # Laptop built-in Intel analog
  {
    matches = [ { node.name = "~alsa_output.pci-0000_00_1f.3.analog.*" } ]
    actions = {
      update-props = {
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }

  # Intel HDMI: low priority
  {
    matches = [ { node.name = "~alsa_output.pci-0000_00_1f.3.hdmi.*" } ]
    actions = {
      update-props = {
        priority.driver = 10
        priority.session = 10
      }
    }
  }
]
